<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Smart Mart</title>
<meta name="description" content="Reset your Smart Mart account password.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
  <div class="page-header">
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="sep">/</span><a href="login.html">Sign In</a><span class="sep">/</span><span class="current">Forgot Password</span>
      </nav>
      <h1>Forgot Password</h1>
    </div>
  </div>

  <div class="section">
    <div class="container">
      <div class="auth-layout__form" style="max-width:480px;margin-inline:auto;border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--sp-8);box-shadow:var(--shadow-md)" data-reveal="zoom">
        <span class="branch-modal__icon" style="margin-inline:auto"><i class="fa-solid fa-key"></i></span>
        <h2 style="text-align:center;margin-top:var(--sp-4)">Reset Your Password</h2>
        <p class="lead" style="text-align:center">Enter the email linked to your account and we'll send you a verification code to reset your password.</p>

        <div class="alert-banner error" data-forgot-alert hidden><i class="fa-solid fa-circle-exclamation"></i><span data-forgot-alert-text></span></div>

        <form data-forgot-form novalidate style="margin-top:var(--sp-5)">
          <div class="field" data-field="email">
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" placeholder="jane@example.com" autocomplete="email">
            <span class="error-msg">Please enter a valid email address.</span>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg"><i class="fa-solid fa-paper-plane"></i> Send Reset Code</button>
        </form>

        <p class="auth-layout__foot">Remembered your password? <a href="login.html">Sign in</a></p>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<script type="module" src="assets/js/main.js"></script>
<script type="module" src="assets/js/pages/forgot-password.js"></script>
</body>
</html>
