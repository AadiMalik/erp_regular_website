<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Your Email — Smart Mart</title>
<meta name="description" content="Enter the verification code to confirm your Smart Mart account.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
  <div class="page-header">
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="sep">/</span><span class="current">Verify Email</span>
      </nav>
      <h1>Verify Your Email</h1>
    </div>
  </div>

  <div class="section">
    <div class="container">
      <div class="auth-layout__form" style="max-width:480px;margin-inline:auto;text-align:center;border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--sp-8);box-shadow:var(--shadow-md)" data-reveal="zoom">
        <span class="branch-modal__icon" style="margin-inline:auto"><i class="fa-solid fa-envelope-open-text"></i></span>
        <h2 style="margin-top:var(--sp-4)">Enter Verification Code</h2>
        <p class="lead" style="text-align:center">We've sent a 4-digit code to <strong data-otp-email>your email</strong>. Since this is a demo store with no email service, the code is also shown as a notification.</p>

        <div class="alert-banner info" data-otp-demo-alert style="margin-top:var(--sp-5);text-align:left"><i class="fa-solid fa-circle-info"></i><span data-otp-demo-code></span></div>
        <div class="alert-banner error" data-otp-error hidden style="text-align:left"><i class="fa-solid fa-circle-exclamation"></i><span data-otp-error-text></span></div>

        <form data-otp-form style="margin-top:var(--sp-6)">
          <div class="otp-inputs">
            <input type="text" inputmode="numeric" maxlength="1" data-otp-digit>
            <input type="text" inputmode="numeric" maxlength="1" data-otp-digit>
            <input type="text" inputmode="numeric" maxlength="1" data-otp-digit>
            <input type="text" inputmode="numeric" maxlength="1" data-otp-digit>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:var(--sp-6)"><i class="fa-solid fa-shield-check"></i> Verify Code</button>
        </form>

        <p class="auth-layout__foot">Didn't get a code? <button type="button" data-otp-resend style="color:var(--color-primary-dark);font-weight:700">Resend Code</button></p>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<script type="module" src="assets/js/main.js"></script>
<script type="module" src="assets/js/pages/verify-otp.js"></script>
</body>
</html>
