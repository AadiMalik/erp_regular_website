<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Wishlist — Smart Mart</title>
<meta name="description" content="Products you've saved for later at Smart Mart.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
  <div class="page-header">
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="sep">/</span><span class="current">Wishlist</span>
      </nav>
      <h1>Your Wishlist</h1>
    </div>
  </div>

  <div class="section">
    <div class="container">

      <div data-wishlist-empty hidden class="cart-empty">
        <i class="fa-regular fa-heart"></i>
        <h2>Your wishlist is empty</h2>
        <p class="text-muted" style="margin:var(--sp-3) 0 var(--sp-5)">Tap the heart icon on any product to save it here for later.</p>
        <a href="shop.html" class="btn btn-primary">Start Shopping</a>
      </div>

      <div class="product-grid stagger" data-wishlist-grid></div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<div class="toast-stack" id="toast-stack" aria-live="polite"></div>
<div class="modal-overlay" id="modal-root"><div class="modal-box"></div></div>
<div class="modal-overlay" id="lightbox-root"><div class="modal-box" style="max-width:1000px;background:transparent;box-shadow:none"></div></div>

<script type="module" src="assets/js/main.js"></script>
<script type="module" src="assets/js/pages/wishlist.js"></script>
</body>
</html>
