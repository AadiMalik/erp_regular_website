<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — Smart Mart</title>
<meta name="description" content="View your Smart Mart order history, track shipments and reorder favourites.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
  <div class="page-header">
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="sep">/</span><span class="current">My Orders</span>
      </nav>
      <h1>My Orders</h1>
    </div>
  </div>

  <div class="section">
    <div class="container">
      <div class="account-layout">
        <nav class="account-nav" data-account-nav>
          <div class="account-nav__user">
            <span class="account-nav__avatar" data-nav-avatar></span>
            <div><strong data-nav-name></strong><span data-nav-email></span></div>
          </div>
          <a href="account.html"><i class="fa-regular fa-user"></i> Profile</a>
          <a href="account-edit.html"><i class="fa-solid fa-pen"></i> Edit Profile</a>
          <a href="orders.html" class="active"><i class="fa-solid fa-bag-shopping"></i> My Orders</a>
          <a href="account-password.html"><i class="fa-solid fa-lock"></i> Change Password</a>
          <hr>
          <button type="button" class="danger" data-nav-logout><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </nav>

        <div>
          <div class="filter-tabs order-filter-tabs" data-order-filters>
            <button type="button" class="active" data-filter="all">All Orders</button>
            <button type="button" data-filter="processing">Processing</button>
            <button type="button" data-filter="shipped">Shipped</button>
            <button type="button" data-filter="out_for_delivery">Out for Delivery</button>
            <button type="button" data-filter="delivered">Delivered</button>
            <button type="button" data-filter="cancelled">Cancelled / Returned</button>
          </div>
          <div data-orders-list></div>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<script type="module" src="assets/js/main.js"></script>
<script type="module" src="assets/js/pages/orders.js"></script>
</body>
</html>
