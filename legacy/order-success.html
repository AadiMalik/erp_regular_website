<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — Smart Mart</title>
<meta name="description" content="Your Smart Mart order has been placed successfully.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
  <div class="section">
    <div class="container">

      <div data-order-missing hidden class="cart-empty">
        <i class="fa-solid fa-circle-exclamation"></i>
        <h2>Order not found</h2>
        <p class="text-muted" style="margin:var(--sp-3) 0 var(--sp-5)">We couldn't find this order.</p>
        <a href="index.html" class="btn btn-primary">Back to Home</a>
      </div>

      <div class="order-success" data-order-success-content hidden>
        <div class="check-circle"><i class="fa-solid fa-check"></i></div>
        <h2>Order Placed Successfully!</h2>
        <p class="text-muted" style="margin-top:var(--sp-3)">Thank you for shopping with Smart Mart. A confirmation has been recorded for your order.</p>
        <div class="order-success__number"><i class="fa-solid fa-receipt"></i> <span data-order-number>#SM-000000</span></div>
        <p class="text-muted" style="font-size:var(--fs-sm)">Estimated delivery: <strong data-order-eta>—</strong></p>

        <div class="account-card" style="text-align:left;margin-top:var(--sp-7)">
          <div data-order-items></div>
          <div class="summary-row total" style="margin-top:var(--sp-3)"><span>Total Paid</span><span data-order-total>$0.00</span></div>
        </div>

        <div class="order-success__actions">
          <a href="#" class="btn btn-outline" data-track-link><i class="fa-solid fa-truck-fast"></i> Track Order</a>
          <a href="shop.html" class="btn btn-primary">Continue Shopping <i class="fa-solid fa-arrow-right"></i></a>
        </div>
      </div>

    </div>
  </div>
</main>

<div id="site-footer"></div>
<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<script type="module" src="assets/js/main.js"></script>
<script type="module" src="assets/js/pages/order-success.js"></script>
</body>
</html>
