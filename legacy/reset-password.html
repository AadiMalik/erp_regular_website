<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Smart Mart</title>
<meta name="description" content="Set a new password for your Smart Mart account.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
  <div class="page-header">
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="sep">/</span><a href="login.html">Sign In</a><span class="sep">/</span><span class="current">Reset Password</span>
      </nav>
      <h1>Reset Password</h1>
    </div>
  </div>

  <div class="section">
    <div class="container">
      <div class="auth-layout__form" style="max-width:480px;margin-inline:auto;border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--sp-8);box-shadow:var(--shadow-md)" data-reveal="zoom">
        <span class="branch-modal__icon" style="margin-inline:auto"><i class="fa-solid fa-lock"></i></span>
        <h2 style="text-align:center;margin-top:var(--sp-4)">Set a New Password</h2>
        <p class="lead" style="text-align:center">Choose a strong new password for your account.</p>

        <div class="alert-banner error" data-reset-alert hidden><i class="fa-solid fa-circle-exclamation"></i><span data-reset-alert-text></span></div>

        <form data-reset-form novalidate style="margin-top:var(--sp-5)">
          <div class="field" data-field="password">
            <label for="password">New Password</label>
            <input id="password" name="password" type="password" placeholder="Create a new password" autocomplete="new-password">
            <div class="pw-strength" data-pw-strength><span></span><span></span><span></span><span></span></div>
            <span class="pw-strength-label" data-pw-strength-label>At least 6 characters</span>
            <span class="error-msg">Password must be at least 6 characters.</span>
          </div>
          <div class="field" data-field="confirmPassword">
            <label for="confirmPassword">Confirm New Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter your new password" autocomplete="new-password">
            <span class="error-msg">Passwords do not match.</span>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg"><i class="fa-solid fa-check"></i> Update Password</button>
        </form>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<script type="module" src="assets/js/main.js"></script>
<script type="module" src="assets/js/pages/reset-password.js"></script>
</body>
</html>
