<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile — Smart Mart</title>
<meta name="description" content="Update your Smart Mart profile details and manage saved delivery addresses.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
  <div class="page-header">
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="sep">/</span><a href="account.html">My Profile</a><span class="sep">/</span><span class="current">Edit Profile</span>
      </nav>
      <h1>Edit Profile</h1>
    </div>
  </div>

  <div class="section">
    <div class="container">
      <div class="account-layout">
        <nav class="account-nav" data-account-nav>
          <div class="account-nav__user">
            <span class="account-nav__avatar" data-nav-avatar></span>
            <div><strong data-nav-name></strong><span data-nav-email></span></div>
          </div>
          <a href="account.html"><i class="fa-regular fa-user"></i> Profile</a>
          <a href="account-edit.html" class="active"><i class="fa-solid fa-pen"></i> Edit Profile</a>
          <a href="orders.html"><i class="fa-solid fa-bag-shopping"></i> My Orders</a>
          <a href="account-password.html"><i class="fa-solid fa-lock"></i> Change Password</a>
          <hr>
          <button type="button" class="danger" data-nav-logout><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </nav>

        <div>
          <div class="account-card">
            <div class="account-card__head">
              <div><h3>Personal Information</h3><p>Update your name and contact number</p></div>
            </div>
            <form data-profile-form novalidate>
              <div class="field-row">
                <div class="field" data-field="name">
                  <label for="name">Full Name</label>
                  <input id="name" name="name" type="text">
                  <span class="error-msg">Please enter your full name.</span>
                </div>
                <div class="field">
                  <label for="email">Email Address</label>
                  <input id="email" type="email" disabled style="background:var(--color-bg-alt);color:var(--color-text-muted)">
                </div>
              </div>
              <div class="field" data-field="phone">
                <label for="phone">Phone Number</label>
                <input id="phone" name="phone" type="tel">
                <span class="error-msg">Please enter a valid phone number.</span>
              </div>
              <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Save Changes</button>
            </form>
          </div>

          <div class="account-card">
            <div class="account-card__head">
              <div><h3>Saved Addresses</h3><p>Manage delivery addresses for faster checkout</p></div>
              <button type="button" class="btn btn-outline btn-sm" data-add-address><i class="fa-solid fa-plus"></i> Add Address</button>
            </div>
            <div class="address-grid" data-address-list></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<script type="module" src="assets/js/main.js"></script>
<script type="module" src="assets/js/pages/account-edit.js"></script>
</body>
</html>
